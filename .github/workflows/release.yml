name: Release

# Stable releases: pushing tag vX.Y.Z on main is the only path that publishes to nuget.org.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # nuget.org Trusted Publishing — exchanges the OIDC token for a short-lived key

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for GitVersion)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Compute version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      # A release never ships what CI didn't verify: repeat the full build/test/format gates.
      - name: Build (Release — analyzers enforce strictness)
        run: dotnet build src/Cloudstrap.sln -c Release -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.gitversion.outputs.semVer }}

      - name: Run all MTP test executables
        run: |
          shopt -s globstar nullglob
          status=0
          count=0
          for proj in src/Test/**/*.Tests.csproj; do
            name="$(basename "${proj%.csproj}")"
            exe="$(dirname "$proj")/bin/Release/net10.0/$name"
            if [ ! -x "$exe" ]; then
              echo "::error::Expected test executable not found: $exe"
              exit 1
            fi
            echo "Running $exe"
            "$exe" || status=1
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No test executables found under src/Test — the test leg must never silently vanish."
            exit 1
          fi
          exit "$status"

      - name: Format check
        run: dotnet format src/Cloudstrap.sln --verify-no-changes

      # Last step before the push: the issued key lives 1 hour and is single-use.
      - name: Authenticate to nuget.org (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish stable packages to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s globstar nullglob
          packages=(src/**/bin/Release/*.nupkg)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No packages produced — stable publish is a no-op (no packable projects yet)."
            exit 0
          fi
          for pkg in "${packages[@]}"; do
            # Pushing a .nupkg also pushes its .snupkg symbol package to nuget.org's symbol server.
            dotnet nuget push "$pkg" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done
