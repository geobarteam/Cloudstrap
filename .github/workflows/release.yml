name: Release

# Two paths publish to nuget.org, both through this file (the Trusted Publishing policy is
# bound to the workflow file name):
# - Stable: pushing tag vX.Y.Z on main. The pattern deliberately excludes prerelease-style
#   tags (v0.1.0-preview.1) — prereleases are never tagged.
# - Preview: manual workflow_dispatch from dev publishes the computed X.Y.Z-preview.N.
#   (Automatic dev pushes still publish previews to GitHub Packages via ci.yml.)
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # nuget.org Trusted Publishing — exchanges the OIDC token for a short-lived key

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for GitVersion)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Compute version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      # Belt and braces behind the triggers: a tag push must build exactly X.Y.Z, and a
      # manual run must build a preview (i.e. be dispatched from dev), never a bare stable.
      - name: Assert version matches trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRERELEASE_TAG: ${{ steps.gitversion.outputs.preReleaseTag }}
          SEMVER: ${{ steps.gitversion.outputs.semVer }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ -n "$PRERELEASE_TAG" ]; then
            echo "::error::Computed version '$SEMVER' is a pre-release — only vX.Y.Z tags on main publish stable to nuget.org."
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$PRERELEASE_TAG" ]; then
            echo "::error::Computed version '$SEMVER' is stable — manual runs publish previews only; dispatch this workflow from dev."
            exit 1
          fi

      # A release never ships what CI didn't verify: repeat the full build/test/format gates.
      - name: Build (Release — analyzers enforce strictness)
        run: dotnet build src/Cloudstrap.sln -c Release -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.gitversion.outputs.semVer }}

      # The E2E suite (src/Test/E2E) drives headless Chromium; without this
      # install the test leg fails loudly with Playwright's install instruction.
      - name: Install Playwright Chromium (E2E)
        run: pwsh src/Test/E2E/Cloudstrap.Demo.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run all MTP test executables
        run: |
          shopt -s globstar nullglob
          status=0
          count=0
          for proj in src/Test/**/*.Tests.csproj; do
            name="$(basename "${proj%.csproj}")"
            exe="$(dirname "$proj")/bin/Release/net10.0/$name"
            if [ ! -x "$exe" ]; then
              echo "::error::Expected test executable not found: $exe"
              exit 1
            fi
            echo "Running $exe"
            "$exe" || status=1
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No test executables found under src/Test — the test leg must never silently vanish."
            exit 1
          fi
          exit "$status"

      - name: Format check
        run: dotnet format src/Cloudstrap.sln --verify-no-changes

      # Last step before the push: the issued key lives 1 hour and is single-use.
      - name: Authenticate to nuget.org (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s globstar nullglob
          packages=(src/**/bin/Release/*.nupkg)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No packages produced — stable publish is a no-op (no packable projects yet)."
            exit 0
          fi
          for pkg in "${packages[@]}"; do
            # Pushing a .nupkg also pushes its .snupkg symbol package to nuget.org's symbol server.
            dotnet nuget push "$pkg" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done
